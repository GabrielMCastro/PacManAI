<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PacMan AI</title>

    <script type="module" src="simulationenvironment.js"></script>
    <script src="modernizr-1.5.min.js"></script>

    <style type="text/css">
      :root {
        --bg: #0b0d12;
        --panel: #141821;
        --card: #1b2030;
        --border: #262c3d;
        --text: #e6e8ee;
        --muted: #8b93a7;
        --accent: #facc15;
        --accent-dim: rgba(250, 204, 21, .15);
        --radius: 10px;
      }

      * { box-sizing: border-box; }

      html, body { height: 100%; margin: 0; }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 14px;
        display: flex;
        flex-direction: column;
        overscroll-behavior-x: none;
      }

      /* ---- Header ---- */
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px;
        padding: 12px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
      }
      header h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: .02em;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .logo {
        width: 18px; height: 18px;
        border-radius: 50%;
        background: conic-gradient(var(--bg) 0 45deg, var(--accent) 45deg 315deg, var(--bg) 315deg);
        transform: rotate(90deg);
      }
      #status { color: var(--muted); font-variant-numeric: tabular-nums; }
      .controls { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
      .divider { width: 1px; height: 22px; background: var(--border); }

      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px 6px 6px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--card);
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      .toggle:hover { border-color: var(--muted); }
      .toggle-track {
        width: 32px; height: 18px;
        border-radius: 999px;
        background: var(--border);
        position: relative;
        transition: background .15s;
      }
      .toggle-track::after {
        content: "";
        position: absolute;
        top: 2px; left: 2px;
        width: 14px; height: 14px;
        border-radius: 50%;
        background: var(--text);
        transition: transform .15s;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px 6px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--card);
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      .btn:hover { border-color: var(--muted); }
      .btn:disabled { opacity: .4; cursor: default; }
      .btn.on { border-color: var(--accent); background: var(--accent-dim); }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
      .btn.danger { background: #ef4444; border-color: #ef4444; color: #fff; font-weight: 600; }
      .btn.primary:hover, .btn.danger:hover { filter: brightness(1.1); }
      /* Pause bars, turning into a play triangle while paused */
      .btn-icon {
        width: 10px; height: 12px;
        border-left: 3px solid var(--text);
        border-right: 3px solid var(--text);
      }
      .btn.on .btn-icon {
        width: 0; height: 0;
        border-style: solid;
        border-width: 6px 0 6px 10px;
        border-color: transparent transparent transparent var(--accent);
      }

      /* Segmented radio group */
      .segmented {
        display: inline-flex;
        margin: 0;
        padding: 3px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--card);
      }
      .segmented legend {
        position: absolute;
        width: 1px; height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }
      .segmented input { position: absolute; opacity: 0; pointer-events: none; }
      .segmented label {
        padding: 4px 12px;
        border-radius: 999px;
        color: var(--muted);
        cursor: pointer;
        white-space: nowrap;
      }
      .segmented label:hover { color: var(--text); }
      .segmented input:checked + label { background: var(--accent); color: var(--bg); font-weight: 600; }
      .segmented input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
      #mode_note { color: var(--accent); font-size: 12px; }

      .toggle.on .toggle-track { background: var(--accent); }
      .toggle.on .toggle-track::after { transform: translateX(14px); background: var(--bg); }

      /* ---- Dialogs ---- */
      .modal {
        width: min(440px, calc(100vw - 40px));
        max-height: calc(100vh - 60px);
        padding: 0;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--panel);
        color: var(--text);
        box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
        flex-direction: column;
      }
      .modal[open] { display: flex; }
      .modal.modal-wide { width: min(680px, calc(100vw - 40px)); }
      .modal::backdrop { background: rgba(0, 0, 0, .6); }
      .modal-title { margin: 0; padding: 16px 20px 0; font-size: 16px; }
      .modal-body { padding: 12px 20px; overflow-y: auto; }
      .modal-body p { margin: 0; color: var(--muted); line-height: 1.5; }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        padding: 14px 20px;
        border-top: 1px solid var(--border);
      }

      .config-form fieldset {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px 16px;
        margin: 0 0 14px;
        padding: 0;
        border: 0;
      }
      .config-form legend {
        padding: 0;
        margin-bottom: 8px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: .08em;
        color: var(--muted);
      }
      .config-row { display: flex; flex-direction: column; gap: 4px; }
      .config-row label { font-weight: 500; }
      .config-row small { color: var(--muted); font-size: 11px; line-height: 1.4; }
      .config-row input[type=number] {
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--card);
        color: var(--text);
        font: inherit;
        font-variant-numeric: tabular-nums;
      }
      .config-row input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
      .config-bool label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
      .config-bool input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
      .config-row .config-error { display: none; color: #f87171; }
      .config-row.invalid input[type=number] { border-color: #f87171; }
      .config-row.invalid .config-error { display: block; }

      .toast {
        position: fixed;
        right: 20px;
        bottom: 20px;
        max-width: 420px;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-left: 3px solid #4ade80;
        border-radius: 8px;
        background: var(--card);
        box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
        transition: opacity .3s;
        z-index: 10;
      }
      .toast.error { border-left-color: #f87171; }
      .toast.hide { opacity: 0; }

      /* ---- Layout ---- */
      main {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        grid-template-rows: auto minmax(390px, 1fr);
        gap: 16px;
        padding: 16px 20px 20px;
        overflow-y: auto;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .panel > h2 {
        margin: 0;
        padding: 10px 14px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: .08em;
        color: var(--muted);
        border-bottom: 1px solid var(--border);
      }
      /* Never squeeze the canvases, let the page scroll instead */
      #games_panel { grid-column: 1; grid-row: 1; min-height: auto; }
      #networks_panel { grid-column: 1; grid-row: 2; }
      #generations_panel { grid-column: 2; grid-row: 1 / span 2; }

      .strip {
        display: flex;
        gap: 12px;
        padding: 14px;
        overflow-x: auto;
        overflow-y: hidden;
        /* Keep trackpad swipes at the end of the strip from navigating back/forward */
        overscroll-behavior-x: contain;
      }
      .strip::-webkit-scrollbar { height: 10px; }
      .strip::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }

      /* ---- Cards ---- */
      .sim-card, .vis-card {
        flex: 0 0 auto;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
      }
      .sim-card canvas { display: block; border-radius: 4px; }
      .card-title { font-weight: 600; margin-bottom: 2px; }
      .card-subtitle {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 8px;
        font-variant-numeric: tabular-nums;
      }
      .sim-card .card-subtitle { margin: 8px 0 0; }
      .vis-card svg { display: block; }
      .vis-card .node { stroke: var(--bg); stroke-width: 1.5px; }
      .vis-card .link { stroke-opacity: .7; }
      .vis-card .node-label { fill: var(--text); font-size: 9px; pointer-events: none; }

      .vis-empty {
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        border: 1px dashed var(--border);
        border-radius: 6px;
      }

      #visbody { flex: 1; align-items: flex-start; }

      /* ---- Headless progress ---- */
      #headless_panel {
        display: none;
        width: 100%;
        min-height: 300px;
        flex-direction: column;
        justify-content: center;
        gap: 22px;
        padding: 20px 40px;
      }
      body.headless #sim_container { display: none; }
      body.headless #headless_panel { display: flex; }
      .progress-head {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        font-variant-numeric: tabular-nums;
      }
      .progress-head span:last-child { color: var(--muted); }
      .progress {
        height: 12px;
        border-radius: 999px;
        background: var(--card);
        border: 1px solid var(--border);
        overflow: hidden;
      }
      .progress > div {
        height: 100%;
        width: 0;
        background: var(--accent);
        border-radius: 999px;
        transition: width .2s;
      }
      .progress.secondary > div { background: #60a5fa; }
      #speed_label { color: var(--muted); font-size: 12px; }

      /* ---- Generation list ---- */
      #generation_list {
        list-style: none;
        margin: 0;
        padding: 10px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #generation_list:empty::before {
        content: "Generation results will appear here";
        color: var(--muted);
        padding: 4px;
      }
      .gen-entry {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        font-variant-numeric: tabular-nums;
      }
      .gen-entry-head { display: flex; justify-content: space-between; margin-bottom: 4px; }
      .gen-number { font-weight: 600; }
      .gen-time { color: var(--muted); font-size: 12px; }
      .gen-mode {
        display: inline-block;
        margin-bottom: 6px;
        padding: 1px 8px;
        border-radius: 999px;
        font-size: 11px;
        background: var(--border);
        color: var(--muted);
      }
      .gen-mode-ghosts { background: rgba(248, 113, 113, .15); color: #f87171; }
      .gen-mode-power { background: rgba(96, 165, 250, .15); color: #60a5fa; }
      .gen-stats { display: flex; gap: 14px; color: var(--muted); }
      .gen-stats b { color: var(--text); font-weight: 600; }
      .gen-bar { margin-top: 6px; height: 4px; background: var(--border); border-radius: 999px; overflow: hidden; }
      .gen-bar > div { height: 100%; background: var(--accent); }
    </style>

</head>

<body>
  <header>
    <h1><span class="logo"></span>PacMan AI</h1>
    <span id="status"></span>
    <div class="controls">
      <span id="mode_note"></span>
      <fieldset class="segmented" title="Training mode, changes take effect at the next generation">
        <legend>Training mode</legend>
        <input type="radio" name="mode" id="mode_pellets" value="pellets" checked>
        <label for="mode_pellets">Pellets only</label>
        <input type="radio" name="mode" id="mode_ghosts" value="ghosts">
        <label for="mode_ghosts">Ghosts</label>
        <input type="radio" name="mode" id="mode_power" value="power">
        <label for="mode_power">Power pill</label>
      </fieldset>
      <button id="pause_toggle" class="btn" aria-pressed="false" title="Pause or resume training (P)">
        <span class="btn-icon"></span>
        <span class="btn-label">Pause</span>
      </button>
      <button id="headless_toggle" class="toggle" aria-pressed="false"
              title="Train at full CPU speed without rendering">
        <span class="toggle-track"></span>
        <span class="toggle-label">Headless off</span>
      </button>
      <span class="divider"></span>
      <button id="save_button" class="btn" title="Save the current generation's networks to ai/seeds">Save networks</button>
      <button id="config_button" class="btn" title="Edit the training config, restarts training">Config</button>
    </div>
  </header>

  <main>
    <section id="games_panel" class="panel">
      <h2>Simulations</h2>
      <div id="sim_container" class="strip"></div>
      <div id="headless_panel">
        <div>
          <div class="progress-head"><span>This generation</span><span id="run_progress_label"></span></div>
          <div class="progress"><div id="run_progress"></div></div>
        </div>
        <div>
          <div class="progress-head"><span>Training</span><span id="gen_progress_label"></span></div>
          <div class="progress secondary"><div id="gen_progress"></div></div>
        </div>
        <span id="speed_label"></span>
      </div>
    </section>

    <section id="networks_panel" class="panel">
      <h2>Current population</h2>
      <div id="visbody" class="strip"></div>
    </section>

    <section id="generations_panel" class="panel">
      <h2>Generations</h2>
      <ol id="generation_list"></ol>
    </section>
  </main>
</body>
</html>
